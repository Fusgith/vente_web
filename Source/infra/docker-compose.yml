# Development database only. Run from Source/: `pnpm db:up` (reads Source/.env).
# Production is a Windows all-in-one folder (ADR-0007), tunnelled to the OVH relay (ADR-0008): T-080.
name: vente-web-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vente}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vente}
      POSTGRES_DB: ${POSTGRES_DB:-vente_web}
      TZ: ${TZ:-Indian/Antananarivo}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:

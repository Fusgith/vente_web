<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- A small lamba: indigo cloth, printed saffron grain border, white field with a sprig of rice
       grains in herringbone, the saffron proverb rule in the lower border. No letter. -->
  <style>
    .rule-small { display: none; }
    @media (max-width: 40px) {
      .print { display: none; }
      .rule-small { display: inline; }
    }
  </style>
  <defs>
    <pattern id="grain" width="10" height="10" patternUnits="userSpaceOnUse" x="8" y="8">
      <g fill="#F5B301">
        <ellipse cx="2.5" cy="2.5" rx="2.2" ry="1" transform="rotate(-42 2.5 2.5)"/>
        <ellipse cx="7.5" cy="2.5" rx="2.2" ry="1" transform="rotate(42 7.5 2.5)"/>
        <ellipse cx="2.5" cy="7.5" rx="2.2" ry="1" transform="rotate(42 2.5 7.5)"/>
        <ellipse cx="7.5" cy="7.5" rx="2.2" ry="1" transform="rotate(-42 7.5 7.5)"/>
      </g>
    </pattern>
  </defs>
  <rect width="96" height="96" rx="22" fill="#2B3A92"/>
  <rect class="print" x="8" y="8" width="80" height="70" rx="12" fill="url(#grain)"/>
  <rect class="rule-small" x="8" y="8" width="80" height="70" rx="12" fill="#F5B301"/>
  <rect x="16" y="16" width="64" height="54" rx="6" fill="#FFFFFF"/>
  <g fill="#2B3A92">
    <ellipse cx="48" cy="30" rx="9" ry="3.8" transform="rotate(90 48 30)"/>
    <ellipse cx="39.5" cy="45" rx="9" ry="3.8" transform="rotate(58 39.5 45)"/>
    <ellipse cx="56.5" cy="45" rx="9" ry="3.8" transform="rotate(-58 56.5 45)"/>
  </g>
  <path d="M48 42v19" stroke="#2B3A92" stroke-width="3" stroke-linecap="round"/>
  <rect x="28" y="84" width="40" height="4" rx="2" fill="#F5B301"/>
</svg>
